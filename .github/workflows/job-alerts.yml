name: Job Alerts

on:
  # NOTE: GitHub's own `schedule:` trigger is intentionally NOT used here.
  # GitHub only guarantees scheduled runs on a "best effort" basis and can
  # silently skip or delay them under load — which is exactly what caused
  # missed 8 AM / 1 PM runs before. cron-job.org now triggers this workflow
  # externally via workflow_dispatch instead, which is far more reliable.
  # Keeping BOTH would risk duplicate emails, so schedule: stays removed.
  workflow_dispatch:
    inputs:
      label:
        description: "Run label shown in the email subject (e.g. 'Morning Digest')"
        required: false
        default: "Job Digest"

permissions:
  contents: write   # needed so the workflow can commit the updated dedup file

jobs:
  send-job-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job fetcher
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RUN_LABEL: ${{ github.event.inputs.label }}
        run: python job_fetcher.py

      - name: Commit updated dedup + pool files
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "actions@github.com"
          git add sent_jobs.json pending_pool.json
          git diff --staged --quiet || git commit -m "Update sent jobs + pending pool [skip ci]"
          git push
