name: Job Alerts

on:
  schedule:
    # Times are UTC. IST = UTC+5:30.
    - cron: "30 2 * * *"   # 8:00 AM IST
    - cron: "30 7 * * *"   # 1:00 PM IST
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated dedup file

jobs:
  send-job-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run label (morning vs afternoon)
        id: label
        run: |
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            echo "label=Morning Digest (8 AM IST)" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * *" ]; then
            echo "label=Afternoon Digest (1 PM IST)" >> "$GITHUB_OUTPUT"
          else
            echo "label=Manual Run" >> "$GITHUB_OUTPUT"
          fi

      - name: Run job fetcher
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RUN_LABEL: ${{ steps.label.outputs.label }}
        run: python job_fetcher.py

      - name: Commit updated dedup + pool files
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "actions@github.com"
          git add sent_jobs.json pending_pool.json
          git diff --staged --quiet || git commit -m "Update sent jobs + pending pool [skip ci]"
          git push
